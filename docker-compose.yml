services:
  postgres:
    image: postgres:17-alpine
    container_name: flotix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flotix
      POSTGRES_USER: flotix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flotix}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotix -d flotix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
